[profile.default]
# A test that runs past a minute is hung, not slow: kill it and say which one.
slow-timeout = { period = "15s", terminate-after = 4 }

[profile.ci]
fail-fast = false
failure-output = "immediate-final"
slow-timeout = { period = "15s", terminate-after = 4 }

[profile.ci.junit]
path = "junit.xml"
